# ==============================================================================
#  SHELL: NOCTALIA — barra, launcher, notificações, OSD, wallpaper, dock
#  Mesma config do niri (~/.config/noctalia/config.toml). Carregado no FIM do
#  hyprland.conf, porque os unbind daqui precisam vir depois dos bind de lá.
#  Pra voltar pra waybar: troque o source no fim do hyprland.conf.
# ==============================================================================

# O --daemon só volta com ela pronta; aí o mywpp aplica o wallpaper pela IPC dela
exec-once = noctalia --daemon && mywpp boot

# Sem a animação de camada do Hyprland: a Noctalia anima os próprios painéis
layerrule = noanim, ^(noctalia-.*)$

# --- Binds da Noctalia (mesmas teclas do niri) ---
unbind = $mainMod, d
bind = $mainMod, d, exec, /home/rud/deving/desktop/UsageTracker/track_bind.sh 'SUPER+d' noctalia msg panel-toggle launcher
bind = $mainMod, n, exec, /home/rud/deving/desktop/UsageTracker/track_bind.sh 'SUPER+n' noctalia msg panel-toggle control-center
bind = $mainMod, i, exec, /home/rud/deving/desktop/UsageTracker/track_bind.sh 'SUPER+i' noctalia msg settings-toggle
bind = $mainMod, a, exec, /home/rud/deving/desktop/UsageTracker/track_bind.sh 'SUPER+a' noctalia msg panel-toggle matheus/argos:painel
bind = $mainMod, Escape, exec, /home/rud/deving/desktop/UsageTracker/track_bind.sh 'SUPER+Escape' noctalia msg session lock

# Áudio e brilho pela Noctalia (mostra o OSD)
unbind = , XF86AudioRaiseVolume
unbind = , XF86AudioLowerVolume
unbind = , XF86AudioMute
unbind = , XF86MonBrightnessUp
unbind = , XF86MonBrightnessDown
bindel = , XF86AudioRaiseVolume, exec, /home/rud/deving/desktop/UsageTracker/track_bind.sh 'none+XF86AudioRaiseVolume' noctalia msg volume-up
bindel = , XF86AudioLowerVolume, exec, /home/rud/deving/desktop/UsageTracker/track_bind.sh 'none+XF86AudioLowerVolume' noctalia msg volume-down
bindl = , XF86AudioMute, exec, /home/rud/deving/desktop/UsageTracker/track_bind.sh 'none+XF86AudioMute' noctalia msg volume-mute
bindel = , XF86MonBrightnessUp, exec, /home/rud/deving/desktop/UsageTracker/track_bind.sh 'none+XF86MonBrightnessUp' noctalia msg brightness-up
bindel = , XF86MonBrightnessDown, exec, /home/rud/deving/desktop/UsageTracker/track_bind.sh 'none+XF86MonBrightnessDown' noctalia msg brightness-down
