# ==============================================================================
#  SHELL: WAYBAR — o esquema antigo (waybar + applets na bandeja + hyprpaper)
#  Pra usar a Noctalia: troque o source no fim do hyprland.conf.
# ==============================================================================

exec-once = mywpp boot              # Aplica o próximo wallpaper da fila (hyprpaper)
exec-once = GDK_SCALE=2 GDK_DPI_SCALE=0.75 waybar   # Barra de status
exec-once = nm-applet --indicator   # Ícone de rede na bandeja
exec-once = blueman-applet          # Ícone de Bluetooth na bandeja
