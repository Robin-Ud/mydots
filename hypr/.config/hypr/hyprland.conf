# ==============================================================================
#  HYPRLAND CONFIG — ThinkPad T14
#
#  Este arquivo faz parte do esquema de "um .conf por layout":
#    hyprland-dwindle.conf / hyprland-master.conf /
#    hyprland-scrolling.conf / hyprland-monocle.conf
#
#  Para trocar de layout:
#    cp ~/.config/hypr/hyprland-<layout>.conf ~/.config/hypr/hyprland.conf
#    e recarregue com Super+Shift+C
#
#  Estrutura: as opções pra futricar ficam NO COMEÇO;
#  o padrão que não precisa mexer fica NO FINAL.
# ==============================================================================

# --- Variáveis (usadas nos binds abaixo) ---
$mainMod     = SUPER
$term        = kitty
$browser     = firefox
$menu        = rofi -show drun -i
$notas       = flatpak run com.github.xournalpp.xournalpp
$filemanager = dolphin

# ██████████████████████████  LAYOUT: MASTER  ██████████████████████████████████
# Uma (ou mais) janela "master" ocupa a esquerda; o resto empilha à direita.
# (estilo dwm)

$layout = master

# --- OPÇÕES PRA FUTRICAR (todas no default do Hyprland 0.51.1) ---
master {
    mfact = 0.55                        # Fração da tela ocupada pelo master [0.0–1.0]
    orientation = left                  # Onde fica o master: left/right/top/bottom/center
    new_status = inherit                # Janela nova vira: slave/master/inherit (herda da focada)
    new_on_top = yes                    # Janela nova entra no topo da pilha de slaves
    new_on_active = none                # Posição relativa à janela focada: before/after/none
    inherit_fullscreen = yes            # Janela nova herda o estado fullscreen
    allow_small_split = no              # Permite 2 masters mesmo com só 2 janelas
    smart_resizing = yes                # Resize considera o lado da janela onde o mouse está
    drop_at_cursor = yes                # Ao arrastar, a janela cai na posição do cursor
    always_keep_position = no           # Master mantém posição/tamanho mesmo sem slaves
    special_scale_factor = 1.0          # Escala das janelas no special workspace (scratchpad)
    slave_count_for_center_master = 2   # Nº mínimo de slaves p/ ativar orientation=center
    center_master_fallback = left       # Orientação usada abaixo desse nº (left/right/top/bottom)
    center_ignores_reserved = no        # Center ignora área reservada (ex: waybar)
}

# --- Binds específicos do master ---
bind = $mainMod, space, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+space' hyprctl dispatch layoutmsg "swapwithmaster"  # Janela focada troca com o master
bind = $mainMod, u, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+u' hyprctl dispatch layoutmsg "focusmaster"  # Foca o master
bind = $mainMod, Tab, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+Tab' hyprctl dispatch layoutmsg "cyclenext"  # Próxima janela da pilha
bind = $mainMod SHIFT, Tab, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+Tab' hyprctl dispatch layoutmsg "cycleprev"  # Janela anterior
bind = $mainMod, comma, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+comma' hyprctl dispatch layoutmsg "addmaster"  # Promove +1 janela a master
bind = $mainMod, period, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+period' hyprctl dispatch layoutmsg "removemaster"  # Remove 1 master
bind = $mainMod, c, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+c' hyprctl dispatch layoutmsg "orientationnext"  # Gira a orientação (era togglesplit no dwindle)
bind = $mainMod SHIFT, m, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+m' hyprctl dispatch layoutmsg "orientationcycle left center right"
binde = $mainMod, minus, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+minus' hyprctl dispatch layoutmsg "mfact -0.05"  # Encolhe o master
binde = $mainMod, equal, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+equal' hyprctl dispatch layoutmsg "mfact +0.05"  # Cresce o master

# Foco estilo vim
bind = $mainMod, h, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+h' hyprctl dispatch movefocus "l"
bind = $mainMod, j, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+j' hyprctl dispatch movefocus "d"
bind = $mainMod, k, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+k' hyprctl dispatch movefocus "u"
bind = $mainMod, l, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+l' hyprctl dispatch movefocus "r"

# ==============================================================================
#  PADRÃO — NÃO PRECISA MEXER (igual em todos os arquivos de layout)
# ==============================================================================

xwayland {
    force_zero_scaling = true
}

# --- Monitor ---
# "preferred" usa a resolução nativa detectada automaticamente.
# Escala 1.25 deixa o texto maior num monitor Full HD pequeno.
# Para forçar: monitor=eDP-1,1920x1080@60,0x0,1.25
monitor = ,preferred,auto,1.25

# --- Ambiente ---
# QT_QPA_PLATFORM: tenta Wayland nativo, cai para XWayland se não funcionar
# Necessário para o QGIS rodar sem bugs gráficos.
env = QT_QPA_PLATFORM,wayland;xcb
env = PATH,$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin

# --- Inicialização (exec-once) ---
# Cada linha roda uma vez quando o Hyprland inicia.
exec-once = mywpp boot              # Aplica o próximo wallpaper da fila
exec-once = kitty -e att_diaria.sh  # Janela de atualização diária do sistema
exec-once = GDK_SCALE=2 GDK_DPI_SCALE=0.75 waybar   # Barra de status
exec-once = nm-applet --indicator   # Ícone de rede na bandeja
exec-once = /usr/bin/lxpolkit       # Agente de autenticação (sudo em apps gráficos)
exec-once = blueman-applet          # Ícone de Bluetooth na bandeja
exec-once = hypridle                # Suspende a tela quando ocioso

# --- Mesa Digitalizadora (Wacom Intuos BT S) ---
# Mapeada para o notebook por padrão. Alt+W alterna para o monitor externo.
device {
    name   = wacom-intuos-bt-s-pen
    output = eDP-1
}

# --- Input (ThinkPad T14) ---
input {
    kb_layout = br
    kb_model  = thinkpad

    follow_mouse = 1

    touchpad {
        natural_scroll = no
        tap-to-click   = true
    }
}

# --- Visual ---
general {
    gaps_in  = 2        # Espaço entre janelas
    gaps_out = 6        # Espaço entre janelas e a borda da tela
    border_size = 2
    col.active_border   = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout           = $layout   # Definido no topo do arquivo
    resize_on_border = true
    hover_icon_on_border = true
}

decoration {
    rounding = 8
    blur {
        enabled = no    # Desativado para economizar bateria
    }
    shadow {
        enabled = no
    }
}

animations {
    enabled = yes
    bezier    = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows,    1, 3, myBezier
    animation = workspaces, 1, 3, default
}

# --- Regras de Janela ---

# Obsidian: tamanho fixo (abre grande, centralizado)
windowrulev2 = size 85% 85%, class:^(md.obsidian.Obsidian)$

# Firefox — diálogos de Salvar/Abrir: flutuantes e centralizados
windowrulev2 = float,   title:^(Salvar como|Abrir)(.*), class:^(org.mozilla.firefox)$
windowrulev2 = size 80% 80%, title:^(Salvar como|Abrir)(.*), class:^(org.mozilla.firefox)$
windowrulev2 = center 1, title:^(Salvar como|Abrir)(.*), class:^(org.mozilla.firefox)$

# Opacidade: janelas inativas ficam com 80% para destacar a ativa
windowrulev2 = opacity 1.0 0.8, class:.*
# Kitty tem sua própria transparência via background_opacity — não sobrescrever
windowrulev2 = opacity 1.0 1.0, class:^(kitty)$
# YouTube, Picture-in-Picture e Google Meet: sempre totalmente opacos
windowrulev2 = opacity 1.0 1.0, title:.*YouTube.*
windowrulev2 = opacity 1.0 1.0, title:.*Meet.*
windowrulev2 = opacity 1.0 1.0, title:^(Picture-in-Picture)$
windowrulev2 = suppressevent fullscreen, title:^(Picture-in-Picture)$

# --- Atalhos de Teclado (Binds comuns) ---

# Aplicações
bind = $mainMod, Return, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+Return' $term
bind = ALT, Return, exec, /home/rud/deving/UsageTracker/track_bind.sh 'ALT+Return' $browser
bind = $mainMod, d, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+d' $menu
bind = ALT, v, exec, /home/rud/deving/UsageTracker/track_bind.sh 'ALT+v' ~/.config/hypr/app-here.sh "md.Obsidian" flatpak run md.obsidian.Obsidian
bind = ALT, a, exec, /home/rud/deving/UsageTracker/track_bind.sh 'ALT+a' ~/.config/hypr/app-here.sh "net.ankiweb.Anki" flatpak run net.ankiweb.Anki
bind = ALT, z, exec, /home/rud/deving/UsageTracker/track_bind.sh 'ALT+z' ~/.config/hypr/app-here.sh "org.zotero.Zotero" flatpak run org.zotero.Zotero
bind = $mainMod, x, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+x' $notas
bind = ALT, g, exec, /home/rud/deving/UsageTracker/track_bind.sh 'ALT+g' QT_QPA_PLATFORM=xcb qgis
bind = ALT, d, exec, /home/rud/deving/UsageTracker/track_bind.sh 'ALT+d' $filemanager

# Wallpaper e cheatsheet de atalhos
bind = $mainMod, w, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+w' mywpp next
bind = $mainMod SHIFT, w, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+w' mywpp delete
bind = $mainMod, slash, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+slash' show-keybinds

# Mesa digitalizadora: alterna entre notebook (eDP-1) e monitor externo (HDMI-A-1)
bind = ALT, w, exec, /home/rud/deving/UsageTracker/track_bind.sh 'ALT+w' ~/.config/hypr/tablet-toggle.sh

# Sistema
bind = $mainMod, q, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+q' pkill rofi || hyprctl dispatch killactive
bind = $mainMod SHIFT, c, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+c' hyprctl reload
bind = $mainMod SHIFT, e, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+e' hyprctl dispatch exit

# Screenshots
# Print         → tela inteira para o clipboard
# Ctrl + Print  → tela inteira salva em ~/Imagens
# Shift + Print → selecionar área para o clipboard  (mais usado)
# Ctrl+Shift+Print → selecionar área e salvar em ~/Imagens
bind = , Print, exec, /home/rud/deving/UsageTracker/track_bind.sh 'none+Print' grim - | wl-copy
bind = CTRL, Print, exec, /home/rud/deving/UsageTracker/track_bind.sh 'CTRL+Print' grim ~/Imagens/$(date +'%Y-%m-%d-%H%M%S_hyprland.png')
bind = SHIFT, Print, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SHIFT+Print' grim -g "$(slurp)" - | wl-copy
bind = CTRL SHIFT, Print, exec, /home/rud/deving/UsageTracker/track_bind.sh 'CTRL-SHIFT+Print' grim -g "$(slurp)" ~/Imagens/$(date +'%Y-%m-%d-%H%M%S_hyprland.png')

# Foco — setas (os binds vim h/j/k/l ficam na seção do layout, no topo)
bind = $mainMod, Left, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+Left' hyprctl dispatch movefocus "l"
bind = $mainMod, Down, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+Down' hyprctl dispatch movefocus "d"
bind = $mainMod, Up, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+Up' hyprctl dispatch movefocus "u"
bind = $mainMod, Right, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+Right' hyprctl dispatch movefocus "r"

# Mover janelas de posição
bind = $mainMod SHIFT, h, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+h' hyprctl dispatch movewindow "l"
bind = $mainMod SHIFT, j, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+j' hyprctl dispatch movewindow "d"
bind = $mainMod SHIFT, k, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+k' hyprctl dispatch movewindow "u"
bind = $mainMod SHIFT, l, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+l' hyprctl dispatch movewindow "r"
bind = $mainMod SHIFT, Left, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+Left' hyprctl dispatch movewindow "l"
bind = $mainMod SHIFT, Down, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+Down' hyprctl dispatch movewindow "d"
bind = $mainMod SHIFT, Up, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+Up' hyprctl dispatch movewindow "u"
bind = $mainMod SHIFT, Right, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+Right' hyprctl dispatch movewindow "r"

# Layout da janela ativa
bind = $mainMod, f, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+f' hyprctl dispatch fullscreen "0"
bind = $mainMod SHIFT, space, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+space' hyprctl dispatch togglefloating
bind = $mainMod, p, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+p' hyprctl dispatch pin  # Sempre visível em todos os workspaces
bind = $mainMod SHIFT, p, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+p' hyprctl dispatch dpms on  # Força a tela a voltar do DPMS off (bug de resume da tela do note)

# Scratchpad — workspace especial escondido
bind = $mainMod, s, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+s' hyprctl dispatch togglespecialworkspace "magic"
bind = $mainMod SHIFT, s, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+s' hyprctl dispatch movetoworkspace "special:magic"

# Workspaces 1-10
bind = $mainMod, 1, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+1' hyprctl dispatch workspace "1"
bind = $mainMod, 2, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+2' hyprctl dispatch workspace "2"
bind = $mainMod, 3, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+3' hyprctl dispatch workspace "3"
bind = $mainMod, 4, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+4' hyprctl dispatch workspace "4"
bind = $mainMod, 5, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+5' hyprctl dispatch workspace "5"
bind = $mainMod, 6, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+6' hyprctl dispatch workspace "6"
bind = $mainMod, 7, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+7' hyprctl dispatch workspace "7"
bind = $mainMod, 8, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+8' hyprctl dispatch workspace "8"
bind = $mainMod, 9, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+9' hyprctl dispatch workspace "9"
bind = $mainMod, 0, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+0' hyprctl dispatch workspace "10"

# Mover janela para workspace
bind = $mainMod SHIFT, 1, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+1' hyprctl dispatch movetoworkspace "1"
bind = $mainMod SHIFT, 2, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+2' hyprctl dispatch movetoworkspace "2"
bind = $mainMod SHIFT, 3, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+3' hyprctl dispatch movetoworkspace "3"
bind = $mainMod SHIFT, 4, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+4' hyprctl dispatch movetoworkspace "4"
bind = $mainMod SHIFT, 5, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+5' hyprctl dispatch movetoworkspace "5"
bind = $mainMod SHIFT, 6, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+6' hyprctl dispatch movetoworkspace "6"
bind = $mainMod SHIFT, 7, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+7' hyprctl dispatch movetoworkspace "7"
bind = $mainMod SHIFT, 8, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+8' hyprctl dispatch movetoworkspace "8"
bind = $mainMod SHIFT, 9, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+9' hyprctl dispatch movetoworkspacesilent "9"  # "silent" = não muda o foco
bind = $mainMod SHIFT, 0, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER-SHIFT+0' hyprctl dispatch movetoworkspacesilent "10"

# Scroll do mouse para mudar workspace
bind = $mainMod, mouse_down, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+mouse_down' hyprctl dispatch workspace "e+1"
bind = $mainMod, mouse_up, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+mouse_up' hyprctl dispatch workspace "e-1"

# Mover/redimensionar janelas com o mouse (segura Super + arrasta)
bindm = $mainMod, mouse:272, movewindow    # Botão esquerdo = mover
bindm = $mainMod, mouse:273, resizewindow  # Botão direito  = redimensionar

# --- Modo Resize ---
# Super + R entra no modo resize; use H/J/K/L para redimensionar; Esc para sair.
bind = $mainMod, r, exec, /home/rud/deving/UsageTracker/track_bind.sh 'SUPER+r' hyprctl dispatch submap "resize"

submap = resize
binde = , h, exec, /home/rud/deving/UsageTracker/track_bind.sh 'none+h' hyprctl dispatch resizeactive "-10 0"
binde = , j, exec, /home/rud/deving/UsageTracker/track_bind.sh 'none+j' hyprctl dispatch resizeactive "0 10"
binde = , k, exec, /home/rud/deving/UsageTracker/track_bind.sh 'none+k' hyprctl dispatch resizeactive "0 -10"
binde = , l, exec, /home/rud/deving/UsageTracker/track_bind.sh 'none+l' hyprctl dispatch resizeactive "10 0"
bind = , escape, exec, /home/rud/deving/UsageTracker/track_bind.sh 'none+escape' hyprctl dispatch submap "reset"
bind = , return, exec, /home/rud/deving/UsageTracker/track_bind.sh 'none+return' hyprctl dispatch submap "reset"
submap = reset

# --- Teclas de Mídia (ThinkPad T14) ---
binde = , XF86AudioRaiseVolume, exec, /home/rud/deving/UsageTracker/track_bind.sh 'none+XF86AudioRaiseVolume' wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, /home/rud/deving/UsageTracker/track_bind.sh 'none+XF86AudioLowerVolume' wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, /home/rud/deving/UsageTracker/track_bind.sh 'none+XF86AudioMute' wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, /home/rud/deving/UsageTracker/track_bind.sh 'none+XF86AudioMicMute' wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
binde = , XF86MonBrightnessUp, exec, /home/rud/deving/UsageTracker/track_bind.sh 'none+XF86MonBrightnessUp' brightnessctl set +5%
binde = , XF86MonBrightnessDown, exec, /home/rud/deving/UsageTracker/track_bind.sh 'none+XF86MonBrightnessDown' brightnessctl set 5%-
