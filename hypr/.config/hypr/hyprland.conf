#==============================================================================
#  HYPRLAND CONFIG - CONVERTIDO DO SWAY (ThinkPad T14 Edition)
# ==============================================================================
xwayland {
    force_zero_scaling = true
}
# --- 1. Monitores ---
# Detecta automático. Se quiser forçar resolução: monitor=eDP-1,1920x1080@60,0x0,1
monitor=,preferred,auto,1

# --- 2. Variáveis ---
$mainMod = SUPER
$term = kitty
$browser = firefox
$menu = rofi -show drun -i # Wofi substitui o Rofi no Wayland nativo melhor
$notas = flatpak run com.github.xournalpp.xournalpp
$termfiles = $term -e bash -i -c 'y; exec bash'
# --- 3. Inicialização (Exec-once) ---
# Wallpaper — adicione imagens em ~/etc/wallpapers/ e reinicie o Hyprland
exec-once = set-wallpaper
exec-once = workspace-wallpaper

# Script diário
exec-once = kitty -e att_diaria.sh

# Barra, Rede, Auth
exec-once = GDK_SCALE=2 GDK_DPI_SCALE=0.75 waybar
exec-once = nm-applet --indicator
exec-once = /usr/bin/lxpolkit
exec-once = blueman-applet
exec-once = hypridle
# --- Mesa Digitalizadora (Wacom Intuos BT S) ---
# Mapeada por padrão no notebook. Alt+W alterna entre os monitores.
device {
    name = wacom-intuos-bt-s-pen
    output = eDP-1
}

# --- 4. Input (ThinkPad T14) ---
input {
    kb_layout = br
    kb_model = thinkpad
    kb_options = 
    
    follow_mouse = 1
    
    touchpad {
        natural_scroll = no
        tap-to-click = true
    }
}

# Configuração visual (Para parecer com Sway/Minimalista)
general {
    gaps_in = 3        # Espaço entre janelas
    gaps_out = 4       # Espaço da borda da tela
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle   # O padrão do Hyprland (espiral), mas configuraremos para parecer tiling
    resize_on_border = true
    hover_icon_on_border = true
}

decoration {
    rounding = 2       # Sem bordas arredondadas (Estilo Sway)
    blur {
        enabled = no   # Desativa blur para economizar bateria do T14
    }
    shadow {
        enabled = no   # Desativa sombras
    }
}

animations {
    enabled = yes
    # Animações rápidas para parecer produtivo
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 3, myBezier
    animation = workspaces, 1, 3, default
}

# --- 5. Layout (Dwindle - Tiling) ---
dwindle {
    pseudotile = yes # Permite janelas "pseudotiled" se quiser
    preserve_split = yes
    force_split = 2  # 0=mouse, 1=esquerda, 2=direita (Tenta imitar o split do Sway)
}

# --- 6. Regras de Janela e Obsidian (O Pulo do Gato) ---

# Regra para o QGIS rodar em XWayland (Correção de bugs gráficos)
env = QT_QPA_PLATFORM,wayland;xcb

# === OBSIDIAN SCRATCHPAD ===
# 1. Se a janela for do Obsidian, jogue silenciosamente para o workspace especial "magic"
windowrulev2 = size 85% 85%, class:^(md.obsidian.Obsidian)$

windowrulev2 = float, title:^(Salvar como|Abrir)(.*), class:^(org.mozilla.firefox)$
windowrulev2 = size 80% 80%, title:^(Salvar como|Abrir)(.*), class:^(org.mozilla.firefox)$
windowrulev2 = center 1, title:^(Salvar como|Abrir)(.*), class:^(org.mozilla.firefox)$


# --- 7. Binds (Atalhos) ---

# Aplicações
bind = ALT, Return, exec, $browser
bind = $mainMod, Return, exec, $term
bind = $mainMod, d, exec, $menu
bind = $mainMod, o, exec, ~/.config/hypr/obsidian-here.sh
bind = $mainMod, x, exec, $notas
bind = $mainMod, g, exec, QT_QPA_PLATFORM=xcb qgis

# Mesa digitalizadora: alterna entre notebook (eDP-1) e LG UltraGear (HDMI-A-1)
bind = ALT, w, exec, ~/.config/hypr/tablet-toggle.sh

# Sistema
bind = $mainMod, q, killactive,
bind = $mainMod SHIFT, c, exec, hyprctl reload
bind = $mainMod SHIFT, e, exit, 
bind = SHIFT, Return, exec, $termfiles

# --- CONFIGURAÇÃO DE SCREENSHOT (Padrão: Clipboard / Ctrl: Salvar) ---

# 1. TELA INTEIRA
# Apenas Print: Copia a tela toda para o Clipboard
bind = , Print, exec, grim - | wl-copy

# Ctrl + Print: Salva a tela toda em ~/Imagens
bind = CTRL, Print, exec, grim ~/Imagens/$(date +'%Y-%m-%d-%H%M%S_hyprland.png')


# 2. SELEÇÃO DE ÁREA (com Shift)
# Shift + Print: Seleciona área e copia para o Clipboard (O mais usado!)
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy

# Ctrl + Shift + Print: Seleciona área e salva em ~/Imagens
bind = CTRL SHIFT, Print, exec, grim -g "$(slurp)" ~/Imagens/$(date +'%Y-%m-%d-%H%M%S_hyprland.png')


# Foco (Vim Style)
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Down, movefocus, d
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Right, movefocus, r

# Mover Janelas
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Down, movewindow, d
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Right, movewindow, r

# Layout Toggles
bind = $mainMod, f, fullscreen, 0
bind = $mainMod SHIFT, space, togglefloating, 
bind = $mainMod, e, togglesplit, # Troca horizontal/vertical no Dwindle

# === SCRATCHPAD CONTROL ===
# Mostra/Esconde o Obsidian (que está no special workspace 'magic')
bind = $mainMod, minus, togglespecialworkspace, magic
# Move janela atual para o scratchpad (se quiser mover outras coisas)
bind = $mainMod SHIFT, minus, movetoworkspace, special:magic

# Workspaces (1-10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Mouse scroll para mudar workspace
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/Resize janelas com mouse (Botão direito e esquerdo + Super)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- 8. Modo Resize (Submap) ---
# Hyprland usa "submaps" igual o mode do Sway
bind = $mainMod, r, submap, resize

submap = resize

binde = , h, resizeactive, -10 0
binde = , j, resizeactive, 0 10
binde = , k, resizeactive, 0 -10
binde = , l, resizeactive, 10 0

bind = , escape, submap, reset 
bind = , return, submap, reset

submap = reset

# --- 9. Teclas de Mídia ThinkPad T14 (Adicionado Extra) ---
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
binde = , XF86MonBrightnessUp, exec, brightnessctl set +10%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
