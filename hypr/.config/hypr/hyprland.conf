# ==============================================================================
#  HYPRLAND CONFIG — ThinkPad T14
# ==============================================================================

xwayland {
    force_zero_scaling = true
}

# --- 1. Monitor ---
# "preferred" usa a resolução nativa detectada automaticamente.
# Escala 1.25 deixa o texto maior num monitor Full HD pequeno.
# Para forçar: monitor=eDP-1,1920x1080@60,0x0,1.25
monitor = ,preferred,auto,1.25

# --- 2. Variáveis e Ambiente ---

# Atalhos usados nos binds mais abaixo
$mainMod     = SUPER
$term        = kitty
$browser     = firefox
$menu        = rofi -show drun -i
$notas       = flatpak run com.github.xournalpp.xournalpp
$filemanager = thunar

# QT_QPA_PLATFORM: tenta Wayland nativo, cai para XWayland se não funcionar
# Necessário para o QGIS rodar sem bugs gráficos.
env = QT_QPA_PLATFORM,wayland;xcb
env = PATH,$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin

# --- 3. Inicialização (exec-once) ---
# Cada linha roda uma vez quando o Hyprland inicia.

exec-once = set-wallpaper           # Aplica o próximo wallpaper da fila
exec-once = kitty -e att_diaria.sh  # Janela de atualização diária do sistema
exec-once = GDK_SCALE=2 GDK_DPI_SCALE=0.75 waybar   # Barra de status
exec-once = nm-applet --indicator   # Ícone de rede na bandeja
exec-once = /usr/bin/lxpolkit       # Agente de autenticação (sudo em apps gráficos)
exec-once = blueman-applet          # Ícone de Bluetooth na bandeja
exec-once = hypridle                # Suspende a tela quando ocioso

# --- Mesa Digitalizadora (Wacom Intuos BT S) ---
# Mapeada para o notebook por padrão. Alt+W alterna para o monitor externo.
device {
    name   = wacom-intuos-bt-s-pen
    output = eDP-1
}

# --- 4. Input (ThinkPad T14) ---
input {
    kb_layout = br
    kb_model  = thinkpad

    follow_mouse = 1

    touchpad {
        natural_scroll = no
        tap-to-click   = true
    }
}

# --- 5. Visual ---
general {
    gaps_in  = 2        # Espaço entre janelas
    gaps_out = 6        # Espaço entre janelas e a borda da tela
    border_size = 2
    col.active_border   = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout           = dwindle
    resize_on_border = true
    hover_icon_on_border = true
}

decoration {
    rounding = 8
    blur {
        enabled = no    # Desativado para economizar bateria
    }
    shadow {
        enabled = no
    }
}

animations {
    enabled = yes
    bezier    = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows,    1, 3, myBezier
    animation = workspaces, 1, 3, default
}

# --- 6. Layout Tiling (Dwindle) ---
# Dwindle divide a tela em espiral: a primeira janela ocupa tudo,
# a segunda divide ao lado, a terceira divide a metade, etc.
dwindle {
    pseudotile    = yes  # Permite janelas "pseudotiled" manualmente
    preserve_split = yes
    force_split   = 2    # 0=segue o mouse, 1=sempre esquerda, 2=sempre direita
}

# --- 7. Regras de Janela ---

# sync-dji: janelinha flutuante centralizada
windowrulev2 = float,  title:^(sync-dji)$
windowrulev2 = size 480 300, title:^(sync-dji)$
windowrulev2 = center 1, title:^(sync-dji)$

# Obsidian: tamanho fixo (abre grande, centralizado)
windowrulev2 = size 85% 85%, class:^(md.obsidian.Obsidian)$

# Firefox — diálogos de Salvar/Abrir: flutuantes e centralizados
windowrulev2 = float,   title:^(Salvar como|Abrir)(.*), class:^(org.mozilla.firefox)$
windowrulev2 = size 80% 80%, title:^(Salvar como|Abrir)(.*), class:^(org.mozilla.firefox)$
windowrulev2 = center 1, title:^(Salvar como|Abrir)(.*), class:^(org.mozilla.firefox)$

# Opacidade: janelas inativas ficam com 80% para destacar a ativa
windowrulev2 = opacity 1.0 0.8, class:.*
# Kitty tem sua própria transparência via background_opacity — não sobrescrever
windowrulev2 = opacity 1.0 1.0, class:^(kitty)$
# YouTube e Picture-in-Picture: sempre totalmente opacos
windowrulev2 = opacity 1.0 1.0, title:.*YouTube.*
windowrulev2 = opacity 1.0 1.0, title:^(Picture-in-Picture)$
windowrulev2 = suppressevent fullscreen, title:^(Picture-in-Picture)$

# --- 8. Atalhos de Teclado (Binds) ---

# Aplicações
bind = $mainMod, Return,       exec, $term
bind = ALT,      Return,       exec, $browser
bind = $mainMod, d,            exec, $menu
bind = $mainMod, o,            exec, ~/.config/hypr/obsidian-here.sh
bind = $mainMod, a,            exec, ~/.config/hypr/anki-here.sh
bind = $mainMod, x,            exec, $notas
bind = $mainMod, g,            exec, QT_QPA_PLATFORM=xcb qgis
bind = SHIFT,    Return,       exec, $filemanager

# Wallpaper e cheatsheet de atalhos
bind = $mainMod, w,            exec, next-wallpaper
bind = $mainMod SHIFT,       w, exec, kill-wallpaper
bind = $mainMod SHIFT CTRL,  w, exec, kitty --title sync-dji -e sync-dji
bind = $mainMod, slash,        exec, show-keybinds

# Mesa digitalizadora: alterna entre notebook (eDP-1) e monitor externo (HDMI-A-1)
bind = ALT, w, exec, ~/.config/hypr/tablet-toggle.sh

# Sistema
bind = $mainMod,       q,       exec, pkill rofi || hyprctl dispatch killactive
bind = $mainMod SHIFT, c,       exec, hyprctl reload
bind = $mainMod SHIFT, e,       exit,

# Screenshots
# Print         → tela inteira para o clipboard
# Ctrl + Print  → tela inteira salva em ~/Imagens
# Shift + Print → selecionar área para o clipboard  (mais usado)
# Ctrl+Shift+Print → selecionar área e salvar em ~/Imagens
bind = ,          Print, exec, grim - | wl-copy
bind = CTRL,      Print, exec, grim ~/Imagens/$(date +'%Y-%m-%d-%H%M%S_hyprland.png')
bind = SHIFT,     Print, exec, grim -g "$(slurp)" - | wl-copy
bind = CTRL SHIFT,Print, exec, grim -g "$(slurp)" ~/Imagens/$(date +'%Y-%m-%d-%H%M%S_hyprland.png')

# Foco — mover entre janelas (estilo vim ou setas)
bind = $mainMod, h,     movefocus, l
bind = $mainMod, j,     movefocus, d
bind = $mainMod, k,     movefocus, u
bind = $mainMod, l,     movefocus, r
bind = $mainMod, Left,  movefocus, l
bind = $mainMod, Down,  movefocus, d
bind = $mainMod, Up,    movefocus, u
bind = $mainMod, Right, movefocus, r

# Mover janelas de posição
bind = $mainMod SHIFT, h,     movewindow, l
bind = $mainMod SHIFT, j,     movewindow, d
bind = $mainMod SHIFT, k,     movewindow, u
bind = $mainMod SHIFT, l,     movewindow, r
bind = $mainMod SHIFT, Left,  movewindow, l
bind = $mainMod SHIFT, Down,  movewindow, d
bind = $mainMod SHIFT, Up,    movewindow, u
bind = $mainMod SHIFT, Right, movewindow, r

# Layout da janela ativa
bind = $mainMod,       f,     fullscreen, 0
bind = $mainMod SHIFT, space, togglefloating,
bind = $mainMod,       p,     pin,             # Sempre visível em todos os workspaces
bind = $mainMod,       e,     togglesplit,     # Troca entre split horizontal/vertical

# Scratchpad — workspace especial escondido
bind = $mainMod,       minus, togglespecialworkspace, magic
bind = $mainMod SHIFT, minus, movetoworkspace, special:magic

# Workspaces 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Mover janela para workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9   # "silent" = não muda o foco
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Scroll do mouse para mudar workspace
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Mover/redimensionar janelas com o mouse (segura Super + arrasta)
bindm = $mainMod, mouse:272, movewindow    # Botão esquerdo = mover
bindm = $mainMod, mouse:273, resizewindow  # Botão direito  = redimensionar

# --- 9. Modo Resize ---
# Super + R entra no modo resize; use H/J/K/L para redimensionar; Esc para sair.
bind = $mainMod, r, submap, resize

submap = resize
binde = , h, resizeactive, -10 0
binde = , j, resizeactive,   0 10
binde = , k, resizeactive,   0 -10
binde = , l, resizeactive,  10 0
bind  = , escape, submap, reset
bind  = , return, submap, reset
submap = reset

# --- 10. Teclas de Mídia (ThinkPad T14) ---
binde = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
binde = , XF86MonBrightnessUp,   exec, brightnessctl set +10%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
