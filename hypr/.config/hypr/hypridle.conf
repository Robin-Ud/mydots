general {
    # Comando para travar (usei hyprlock, mas pode ser swaylock)
    lock_cmd = pidof hyprlock || hyprlock
    
    # Travar a tela ANTES do sistema dormir (importante para segurança)
    before_sleep_cmd = loginctl lock-session
    
    # Ligar a tela se você acordar o PC (evita ter que teclar 2x)
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 1. Diminuir brilho após 2.5 min (avisa visualmente que vai travar)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10         # Salva brilho atual e reduz p/ 10%
    on-resume = brightnessctl -r                 # Restaura o brilho original
}

# 2. Travar a tela após 5 min (segurança)
listener {
    timeout = 300
    on-timeout = loginctl lock-session           # Chama o lock_cmd definido lá em cima
}

# 3. Desligar o monitor após 5.5 min (economia de energia)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off       # Desliga o sinal de vídeo
    on-resume = hyprctl dispatch dpms on         # Liga ao mexer no mouse/teclado
}

# 4. Suspender o PC após 15 min (economia máxima)
listener {
    timeout = 900
    on-timeout = systemctl suspend               # Manda o note dormir
}
