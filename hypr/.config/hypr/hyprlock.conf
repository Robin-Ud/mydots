# Tela de bloqueio — chamada pelo hypridle (lock_cmd) e no before_sleep.
# Destrava com a digital (fprintd) OU com a senha do usuário.

general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    pam:enabled = true
    fingerprint:enabled = true
    fingerprint:ready_message = Encoste o dedo ou digite a senha
    fingerprint:present_message = Lendo digital...
    fingerprint:retry_delay = 250
}

# Fundo: print da tela desfocado
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
}

# Relógio
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    font_family = JetBrainsMono Nerd Font
    font_size = 96
    color = rgba(ffffffee)
    position = 0, 180
    halign = center
    valign = center
}

# Data
label {
    monitor =
    text = cmd[update:60000] LC_TIME=pt_BR.UTF-8 date +'%A, %d de %B'
    font_family = JetBrainsMono Nerd Font
    font_size = 18
    color = rgba(ffffffaa)
    position = 0, 90
    halign = center
    valign = center
}

# Campo de senha (mesmas cores da borda ativa do Hyprland)
input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    inner_color = rgba(1a1b26cc)
    font_color = rgba(ffffffee)
    check_color = rgba(00ff99ee)
    fail_color = rgba(ff5555ee)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = $FPRINTPROMPT
    fail_text = $FAIL ($ATTEMPTS)
    dots_center = true
    fade_on_empty = false
    rounding = 12
    position = 0, -40
    halign = center
    valign = center
}
