# ~/.config/foot/foot.ini

[main]
# Fonte: Use "JetBrainsMono NF" ou "FiraCode NF" se tiver instalado para os ícones.
# Se não, "monospace" usa a padrão do sistema.
font=monospace:size=8
# Melhora a renderização da fonte
dpi-aware=yes

# Espaçamento interno (Margem) - Deixa muito mais elegante
pad=20x20

[cursor]
style=block
blink=yes

[colors]
# Tema: Tokyo Night
background=1a1b26
foreground=c0caf5

## Normal/Regular colors (0-7)
regular0=15161e  # black
regular1=f7768e  # red
regular2=9ece6a  # green
regular3=e0af68  # yellow
regular4=7aa2f7  # blue
regular5=bb9af7  # magenta
regular6=7dcfff  # cyan
regular7=a9b1d6  # white

## Bright colors (8-15)
bright0=414868   # bright black
bright1=f7768e   # bright red
bright2=9ece6a   # bright green
bright3=e0af68   # bright yellow
bright4=7aa2f7   # bright blue
bright5=bb9af7   # bright magenta
bright6=7dcfff   # bright cyan
bright7=c0caf5   # bright white

## Dimmed colors (Opcional, se o foot suportar na sua versão)
# dim0=...
