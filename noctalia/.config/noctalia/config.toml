config_version = 16

[bar.default]
end = [
    "clipboard",
    "bluetooth",
    "network",
    "volume",
    "brightness",
    "battery",
    "matheus/argos:widget",
    "control-center",
    "session"
]
scale = 1.2000000104308128
start = [ "launcher", "workspaces", "media" ]
thickness = 45
widget_spacing = 20

[calendar]
enabled = true

    [calendar.account.personal_google]
    type = "google"

[control_center.calendar]
show_week_numbers = true

