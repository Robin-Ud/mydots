# hypridle no niri — mesmos tempos do Hyprland (arquivado na tag hyprland-final),
# mas travando pela Noctalia e apagando a tela pelo niri.
# Sobe no spawn-at-startup do config.kdl. O idle da Noctalia fica desligado.

general {
    # Super+Esc, ociosidade e tampa: tela de bloqueio da Noctalia
    lock_cmd = noctalia msg session lock

    # Toda vez que trava: muta o som (sala de aula)
    on_lock_cmd = wpctl set-mute @DEFAULT_AUDIO_SINK@ 1

    # Trava ANTES de dormir; muta primeiro pra não acordar tocando nada
    before_sleep_cmd = wpctl set-mute @DEFAULT_AUDIO_SINK@ 1; loginctl lock-session

    # 3 = segura a suspensão até a tela de bloqueio estar de fato na tela
    inhibit_sleep = 3

    # Liga a tela ao acordar (evita ter que teclar 2x)
    after_sleep_cmd = niri msg action power-on-monitors
}

# 1. Escurecer após 2.5 min (avisa que vai travar)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 2. Travar após 5 min
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 3. Apagar a tela após 5.5 min
listener {
    timeout = 330
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}

# 4. Suspender após 15 min — só em máquina com bateria (o note sim, o PC não)
listener {
    timeout = 900
    on-timeout = ls /sys/class/power_supply/BAT* >/dev/null 2>&1 && systemctl suspend
}
