# ==============================================================================
#  KITTY CONFIG - Portado do Foot (Tokyo Night)
# ==============================================================================

# --- 1. Fontes ---
# Portado: monospace tamanho 8
# DICA: No T14, 8.0 pode ficar pequeno. Se precisar, mude para 10.0 ou 11.0
font_family      monospace
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# --- 2. Janela e Layout (Hyprland Friendly) ---
# Portado: pad=20x20
window_padding_width 20

# Remove barra de título e bordas do Kitty (deixa o Hyprland cuidar disso)
hide_window_decorations yes

# Desabilita o som de "bip" (bell)
enable_audio_bell no

# Não pede confirmação ao fechar a janela (útil para tiling WMs ao usar Super+Q)
confirm_os_window_close 0

# Histórico de rolagem (Scrollback)
scrollback_lines 10000

# --- 3. Cursor ---
# Portado: block e blinking
cursor_shape block
cursor_blink_interval 0.5
# Cor do cursor (usa o foreground invertido ou uma cor específica)
cursor #c0caf5
cursor_text_color background

# --- 4. Cores (Tokyo Night) ---
# Portado diretamente dos hexadecimais do seu foot.ini

foreground #c0caf5
background #1a1b26

# Opacidade (Descomente se quiser transparência)
# background_opacity 0.9

# Black
color0 #15161e
color8 #414868

# Red
color1 #f7768e
color9 #f7768e

# Green
color2 #9ece6a
color10 #9ece6a

# Yellow
color3 #e0af68
color11 #e0af68

# Blue
color4 #7aa2f7
color12 #7aa2f7

# Magenta
color5 #bb9af7
color13 #bb9af7

# Cyan
color6 #7dcfff
color14 #7dcfff

# White
color7 #a9b1d6
color15 #c0caf5

# --- 5. Mapeamentos Úteis ---
# Copiar/Colar padrão (Ctrl+Shift+C/V) já vem nativo no Kitty.
# Atalho para mudar tamanho da fonte on-the-fly (Ctrl+Shift+Equal / Minus)
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
